<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팀플 회의 — 로미원 약속</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
  /* 모임 페이지 /m/[id] — 한 주소, 상태에 따라 화면이 바뀐다 (PRD §5.3). 상태 목록은 DESIGN-SPEC.md §1
     ?v=…  ?sheet=confirm|menu|delete|cal|uncf|list|key|delr  ?days=8  ?alt=b  ?inapp=1  ?theme=dark  ?change=1 */
  #app { padding-bottom: calc(var(--bar-h) + 24px); max-width: 1100px; }
  #app[data-narrow] { max-width: 600px; }
  .sec-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: var(--s-3); }
  .task { padding-block: var(--s-2) var(--s-4); }
  .task p { color: var(--text-muted); margin-top: 2px; }
  .tools { display: flex; gap: var(--s-2); margin-bottom: var(--s-3); flex-wrap: wrap; }
  .tools .btn { min-height: 40px; }
  .who-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .who-chips .chip { min-height: 32px; font-size: 13px; padding: 0 12px; background: var(--bg-subtle); border-color: var(--border); }
  .mini { padding: var(--s-4); }
  .modal-btns { display: grid; gap: 8px; margin-top: 8px; }
  .foot-note { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px; padding-block: var(--s-6) var(--s-2); color: var(--text-subtle); font-size: 13px; }
  .foot-note .link-btn { min-height: 36px; padding: 0 8px; font-size: 13px; color: var(--accent-ink); }
  /* 날짜만 결과: 날짜별 가로 막대 (돼요 진하게 · 애매 옅게+줄무늬 · 숫자 병기 = 색만으로 구분하지 않음) */
  .bars { display: flex; flex-direction: column; gap: 4px; }
  .bar-row { display: grid; grid-template-columns: 84px 1fr; gap: 2px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .bar-row.top { background: var(--accent-subtle); border-radius: var(--r-sm); padding-inline: 8px; margin-inline: -8px; border-bottom-color: transparent; }
  .bar-row .d { font-weight: 700; font-size: 14px; grid-row: span 2; } .bar-row .d small { display: block; font-weight: 500; color: var(--text-subtle); font-size: 12px; }
  .bar-track { display: flex; height: 18px; border-radius: 9px; overflow: hidden; background: var(--heat-0); border: 1px solid var(--border); }
  .bar-track i { display: block; height: 100%; } .bar-track .y { background: var(--accent); } .bar-track .m { background: var(--heat-2); background-image: repeating-linear-gradient(135deg, transparent 0 3px, rgba(255,255,255,.45) 3px 5px); }
  .bar-num { font-size: 12px; color: var(--text-muted); }
  /* 응답자 목록 시트 */
  .rl { display: flex; flex-direction: column; max-height: 52dvh; overflow: auto; }
  .rl li { list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; min-height: 52px; border-bottom: 1px solid var(--border); }
  .rl button.nm { all: unset; cursor: pointer; display: flex; flex-direction: column; padding-block: 6px; min-height: 44px; justify-content: center; }
  .rl button.nm:focus-visible { outline: 2px solid var(--focus-ring); }
  .rl .nm b { font-size: 16px; } .rl .nm small { color: var(--text-subtle); font-size: 12px; }
  .rl .btn { min-height: 36px; font-size: 13px; padding: 0 12px; }
  .sk-grid { height: 420px; border-radius: var(--r-md); }
  a.menu-item { min-height: 52px; display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-2); border-bottom: 1px solid var(--border); font-size: 16px; }
  @media (min-width: 1024px) {
    #app { padding-bottom: var(--s-16); }
    .split > aside { order: 2; }
    .mobile-only-bar { display: none !important; }
    #app:not([data-narrow]) .submit-bar { max-width: 360px; margin-left: auto; margin-top: var(--s-4); }
  }
  @media (max-width: 1023px) { .split.af > aside { order: -1; } }
</style>
</head>
<body>
<div class="page">
  <div id="hdr" data-header="back"></div>
  <main class="wrap with-bar" id="app"></main>
</div>
<script>
  /* 헤더 설정은 shared.js 가 실행되기 전에 */
  const Q = new URLSearchParams(location.search), V = Q.get("v") || "result";
  const RES = ["result", "result-one", "result-none", "result-short", "result-date", "result-dow", "result-many"];
  const ADM = ["admin", "admin-empty", "admin-date", "admin-many"];
  const CNF = ["confirmed", "confirmed-part", "confirmed-changed", "confirmed-changed-admin", "confirmed-admin", "confirmed-date", "confirmed-dow", "past"];
  const hdr = document.getElementById("hdr");
  const kindOf = () => RES.includes(V) ? "share" : ADM.includes(V) ? "admin" : ["confirmed-admin", "confirmed-changed-admin"].includes(V) ? "more" : ["paint", "paint-dow", "paint-closed", "dateonly"].includes(V) ? "me" : "";
  const compact = V === "name" || CNF.includes(V) || V === "loading";
  hdr.dataset.header = compact ? "compact" : "back"; hdr.dataset.title = "팀플 회의"; hdr.dataset.href = "m.html?v=name";
</script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/grid.js"></script>
<script>
(function () {
  const app = document.getElementById("app"), days = +(Q.get("days") || 3), $ = (s) => document.querySelector(s);
  const IS_ADMIN = ADM.includes(V) || ["confirmed-admin", "confirmed-changed-admin"].includes(V) || (V === "confirmed-date" && !!Q.get("admin"));
  const CHANGE = !!Q.get("change");

  /* ================= 샘플 데이터 (결과·총무·확정 화면이 모두 같은 응답을 쓴다 — E-02) ================= */
  const P = LM.PEOPLE;                                              // 지원·민수·서연·하준·예린 (5명)
  const D5 = P;
  const D3 = { 지원: P.지원, 민수: P.민수, 서연: P.서연 };
  const D1 = { 지원: P.지원 };
  const DNONE = { 지원: [[[19, 21]], [[10, 12]], []], 민수: [[[19, 21]], [], []], 서연: [[], [[10, 12]], [[9, 11]]] };      // 전원 없음 + 동률
  const DSHORT = { 지원: [[[19, 20]], [], []], 민수: [[[19.5, 21]], [], []], 서연: [[[19.5, 20]], [], []] };               // 1시간 겹침 없음 → 30분 폴백
  const DPART = Object.assign({}, D5, { 민수: [[[17, 19]], [[14, 18]], [[19, 21]]] });                                      // 수 19–21 민수 불가
  const POOL = ["지원", "민수", "서연", "하준", "예린", "도윤", "서준", "지우", "하은", "수아", "시우", "예준", "주원", "지호", "유진", "채원", "현우", "다은", "민재", "소율", "건우", "나연", "태민", "아린"];
  const DMANY = {}; POOL.forEach((n, i) => { const b = P[POOL[i % 5]]; DMANY[n] = i >= 5 && i % 3 === 0 ? [b[0], [], b[2]] : b; });
  const DDOW = {}; Object.keys(D5).forEach((n) => { DDOW[n] = [[], [], ...D5[n]]; });                                           // 월0 화1 수2 목3 금4 …
  const DATA = { "result-one": D1, "result-none": DNONE, "result-short": DSHORT, "result-many": DMANY, "result-dow": DDOW, admin: D3, "admin-many": DMANY, "admin-date": D3, "confirmed-part": DPART }[V] || D5;
  const NAMES = Object.keys(DATA), N = NAMES.length;
  const isDow = V === "result-dow" || V === "paint-dow" || V === "confirmed-dow";
  const GRID = { from: 9, to: 23, days: isDow ? 7 : days };
  const DOWN = ["월", "화", "수", "목", "금", "토", "일"];

  /* ================= 추천 시간 계산 (PRD v1.1: 인원 → 연속 길이 → 이른 날짜, 최대 3개, 공동 순위 1·1·3) ================= */
  const hm = (t) => `${String(Math.floor(t)).padStart(2, "0")}:${t % 1 ? "30" : "00"}`;
  function candidates(data, nd, from, to, L) {
    const rows = (to - from) * 2, names = Object.keys(data), cells = [];
    for (let d = 0; d < nd; d++) { cells[d] = []; for (let r = 0; r < rows; r++) { const t = from + r / 2; cells[d][r] = new Set(names.filter((n) => ((data[n] || [])[d] || []).some(([a, b]) => t >= a && t < b))); } }
    const sup = (a, s) => a && [...s].every((x) => a.has(x)), out = [];
    for (let d = 0; d < nd; d++) for (let s = 0; s < rows; s++) {
      let set = new Set(names);
      for (let e = s; e < rows; e++) {
        set = new Set([...set].filter((x) => cells[d][e].has(x))); if (!set.size) break;
        if (e - s + 1 >= L && !sup(cells[d][s - 1], set) && !sup(cells[d][e + 1], set)) out.push({ d, a: from + s / 2, b: from + (e + 1) / 2, set, c: set.size, len: e - s + 1 });
      }
    }
    out.sort((x, y) => y.c - x.c || y.len - x.len || x.d - y.d || x.a - y.a);
    const pick = []; out.forEach((x) => { if (pick.length < 3 && !pick.some((p) => p.d === x.d && p.a < x.b && x.a < p.b)) pick.push(x); });
    pick.forEach((x) => (x.rank = 1 + pick.filter((y) => y.c > x.c).length));
    return pick;
  }
  function best(minL) {
    let list = candidates(DATA, GRID.days, GRID.from, GRID.to, minL), fell = false;
    if (N > 1 && minL > 1 && !list.some((x) => x.c >= 2)) { list = candidates(DATA, GRID.days, GRID.from, GRID.to, 1); fell = true; }   // Q-06 자동 30분
    return { list, fell };
  }
  const dayName = (d) => (isDow ? `매주 ${DOWN[d]}` : `${LM.DAYS[d].w} ${LM.DAYS[d].d}`);

  /* ================= 조각 ================= */
  const summary = (n, o = {}) => `<div class="summary"><h1 class="t-h1">팀플 회의</h1><div class="meta"><span>${icon("cal")}${o.dates || "10월 29일(수) ~ 31일(금)"}</span>${o.noTime ? "" : `<span>${icon("clock")}09:00 ~ 23:00</span>`}<span>${icon("user")}${n}명 응답</span></div></div>`;
  const card = (x, admin) => {
    const miss = NAMES.filter((n) => !x.set.has(n)), all = x.c === N;
    const who = `${all ? `<span class="all-badge">${icon("check")}전원 가능</span>` : ""}${x.c}/${N}명${!all ? ` · <span class="miss">${miss.slice(0, 2).join("·")}${miss.length > 2 ? ` 외 ${miss.length - 2}명` : ""} 빠짐</span>` : ""}`;
    const when = `${dayName(x.d)} ${hm(x.a)}–${hm(x.b)}`, tag = admin ? "div" : "button";
    const body = `<span class="rank">${x.rank}</span><span><span class="when">${when}</span><span class="who">${who}</span></span>`;
    /* 버튼 안에 버튼을 중첩하지 않는다 → 총무 카드는 div + 별도 확정 버튼 */
    return `<${tag} class="best ${x.rank === 1 ? "first" : ""}" ${admin ? "" : 'type="button" aria-pressed="false"'} data-r="${x.d},${x.a},${x.b}">${body}${admin ? `<button class="cta btn ${x.rank === 1 ? "primary" : "secondary"} block" data-open="#sh-confirm" data-when="${when}" data-c="${x.c}">${CHANGE ? "이 시간으로 바꾸기" : "이 시간으로 확정"}</button>` : ""}</${tag}>`;
  };
  const bestSection = () => `<section><div class="sec-title"><h2 class="t-h2">가장 좋은 시간</h2></div><div id="best-banner"></div><div class="stack" id="best-list" style="gap:var(--s-2)"></div>${N > 1 ? `<div class="chips" role="group" aria-label="최소 길이" style="margin-top:var(--s-3)"><button class="chip" aria-pressed="false" data-f="1">30분 이상</button><button class="chip" aria-pressed="true" data-f="2">1시간 이상</button><button class="chip" aria-pressed="false" data-f="4">2시간 이상</button></div><p class="t-caption" id="best-cap" style="margin-top:8px" hidden>1시간 이상 겹치는 시간이 없어 30분 단위로 보여줘요</p>` : ""}</section>`;
  function drawBest(admin, minL) {
    const { list, fell } = best(minL), box = $("#best-list"); if (!box) return;
    box.innerHTML = list.map((x) => card(x, admin)).join("") || `<p class="muted">겹치는 시간이 아직 없어요</p>`;
    const cap = $("#best-cap"); if (cap) { cap.hidden = !fell; if (fell) cap.textContent = `${minL === 4 ? "2시간" : "1시간"} 이상 겹치는 시간이 없어 30분 단위로 보여줘요`; }
    const maxC = list[0] ? list[0].c : 0, bn = $("#best-banner");
    if (bn) bn.innerHTML = N > 1 && maxC < N ? `<div class="banner warning" style="margin-bottom:var(--s-3)">${icon("info")}<span>모두 되는 시간은 없어요. 가장 많이 되는 시간이에요</span></div>` : "";
  }
  const chipsHtml = (admin) => { const show = NAMES.slice(0, 6), more = N - show.length;
    return `<div class="resp-chips" id="chips"><span class="count">${N}명 응답</span>${show.map((n) => `<button class="chip" aria-pressed="false" data-n="${n}">${n}</button>`).join("")}${more > 0 ? `<button class="chip" data-open="#sh-list">외 ${more}명</button>` : ""}${admin ? `<button class="chip" data-open="#sh-list" style="border-style:dashed">${icon("pencil")}&nbsp;응답 관리</button>` : ""}</div>`; };
  const cta = (t = "우리 모임도 이걸로 정하기") => `<div class="create-cta"><div><b>${t}</b><p>링크 하나면 10초면 끝나요</p></div><a class="btn secondary" href="new.html">새 약속 만들기</a></div>`;
  const legend = (n) => `<div class="legend"><span>0명</span><span class="scale">${[0, 1, 2, 3, 4, 5].map((i) => `<i style="background:var(--heat-${i})"></i>`).join("")}</span><span>${Math.max(1, n - 1)}명</span><span class="all"><i></i>전원 가능</span></div>`;
  const heat = (id) => `<div id="${id}"></div>`;
  const bar = (inner) => `<div class="submit-bar"><div class="inner">${inner}</div></div>`;
  const myEdit = bar(`<a class="btn secondary lg block" href="m.html?v=paint">내 응답 수정</a>`);
  /* Q-08: 총무 키 없는 기기 안내 */
  const noKey = `<div class="foot-note"><span>총무라면 총무 링크로 들어오세요</span><button class="link-btn" data-open="#sh-key">총무 링크로 열기</button></div>`;

  /* 날짜만 모드 샘플 (Q-04): [날짜, 요일, 돼요, 애매] — 점수 = 돼요 1 + 애매 0.5, 동률이면 돼요 수 → 이른 날짜 */
  const DATES = [["11월 8일", "토", 5, 0], ["11월 9일", "일", 3, 2], ["11월 15일", "토", 4, 1], ["11월 16일", "일", 2, 1], ["11월 22일", "토", 4, 0], ["11월 23일", "일", 1, 2]];
  const dscore = (r) => r[2] + r[3] * 0.5;
  const dateRank = DATES.map((r, i) => ({ r, i })).sort((a, b) => dscore(b.r) - dscore(a.r) || b.r[2] - a.r[2] || a.i - b.i).slice(0, 3);
  const dateCards = (admin) => dateRank.map(({ r }) => { const no = 5 - r[2] - r[3], rank = 1 + dateRank.filter((y) => dscore(y.r) > dscore(r)).length;
    const who = `${no === 0 && r[3] === 0 ? `<span class="all-badge">${icon("check")}전원 가능</span>` : ""}돼요 ${r[2]} · 애매 ${r[3]}${no ? ` · <span class="miss">${no}명 불가</span>` : ""}`, when = `${r[0]} (${r[1]})`;
    const body = `<span class="rank">${rank}</span><span><span class="when">${when}</span><span class="who">${who}</span></span>`;
    return admin ? `<div class="best ${rank === 1 ? "first" : ""}">${body}<button class="cta btn ${rank === 1 ? "primary" : "secondary"} block" data-open="#sh-confirm" data-when="${when}" data-c="${r[2] + r[3]}" data-date="1">이 날로 확정</button></div>` : `<div class="best ${rank === 1 ? "first" : ""}">${body}</div>`; }).join("");
  const dateBars = `<div class="bars" role="list" aria-label="날짜별 응답">${DATES.map((r) => `<div class="bar-row ${dateRank[0].r === r ? "top" : ""}" role="listitem"><div class="d">${r[0]}<small>${r[1]}요일</small></div><div class="bar-track" aria-hidden="true"><i class="y" style="width:${r[2] * 20}%"></i><i class="m" style="width:${r[3] * 20}%"></i></div><div class="bar-num">돼요 ${r[2]} · 애매 ${r[3]}</div></div>`).join("")}</div><div class="legend" style="margin-top:12px"><span class="scale"><i style="background:var(--accent)"></i></span>돼요 <span class="scale"><i style="background:var(--heat-2)"></i></span>애매</div>`;

  /* ================= 화면 ================= */
  const views = {
    /* SCR-05 이름 입력 */
    name: () => `${summary(3)}
      <div class="task"><h2 class="t-h2">가능한 시간을 알려주세요</h2><p>이름만 쓰면 바로 시작해요</p></div>
      <div class="who-chips" style="margin-bottom:var(--s-6)"><span class="t-caption">이미 응답한 사람</span><span class="chip">지원</span><span class="chip">민수</span><span class="chip">서연</span></div>
      <div class="field"><label for="nm">이름 <span class="counter" id="nc" hidden></span></label>
        <input class="input" id="nm" name="nickname" maxlength="20" placeholder="예: 지원" autocomplete="nickname" spellcheck="false" aria-describedby="nh ne"><span class="hint" id="nh">별명도 괜찮아요</span>
        <span class="err" id="ne" hidden>이미 있는 이름이에요. 이름 뒤에 글자를 붙이거나 별명을 써 주세요</span></div>
      <div class="submit-bar"><div class="inner"><a class="btn primary lg block" id="go" href="m.html?v=${Q.get("mode") === "date" ? "dateonly" : Q.get("mode") === "dow" ? "paint-dow" : "paint"}" aria-disabled="true">시간 고르기</a><span class="trust">로그인 없이 · 30초면 끝</span></div></div>`,

    /* SCR-06 시간 칠하기 (+ 요일 모드 / 마감) */
    paint: (o = {}) => `<div class="split"><div>
      ${o.closed ? `<div class="banner warning" style="margin-block:var(--s-3)">${icon("warn")}<span>응답이 마감됐어요</span></div>` : ""}
      <div class="task"><h1 class="t-h2">${o.closed ? "마감된 모임이에요" : "되는 시간을 칠해 주세요"}</h1>${o.dow ? `<p>매주 반복되는 요일·시간을 칠해 주세요</p>` : ""}</div>
      <div class="tools"><button class="btn secondary" id="all" ${o.closed ? "disabled" : ""}>전부 가능</button><button class="btn secondary" aria-pressed="false" id="oth">다른 사람 보기</button>
        ${Q.get("alt") === "b" ? `<button class="btn secondary paint-toggle" aria-pressed="true" id="pt">${icon("pencil")} 칠하기 모드</button>` : ""}</div>
      <div style="position:relative">${heat("g")}${o.closed ? "" : `<div class="coach" id="coach" ${Q.get("coach") === "0" ? "hidden" : ""}><div class="finger"></div><b>누른 채로 쭉 내리면 한 번에 칠해져요</b></div>`}</div></div>
      <aside class="only-desktop"><div class="card mini stack"><b class="t-h2">지금까지 응답</b><p class="muted">3명이 응답했어요</p><div class="best first" style="pointer-events:none"><span class="rank">1</span><span><span class="when">수 10/29 19:00–21:00</span><span class="who">3/3명</span></span></div></div></aside></div>
      ${o.closed ? bar(`<a class="btn primary lg block" href="m.html?v=result">결과 보기</a>`) : `<div class="submit-bar mobile-only-bar" id="bar"><div class="inner split"><span class="sum" id="sum" aria-live="polite">선택 <b>0</b>시간</span><button class="btn primary lg" id="go">되는 시간 없이 제출</button></div></div>`}`,

    /* SCR-06b 날짜만 */
    dateonly: () => `<div class="task"><h1 class="t-h2">되는 날을 골라 주세요</h1></div><div class="stack" id="dl">

    const chipsEl = $("#chips");
    const setPerson = (n, on) => { g.api.person(on ? n : null); if (chipsEl) chipsEl.querySelectorAll(".chip[data-n]").forEach((x) => x.setAttribute("aria-pressed", on && x.dataset.n === n)); };
    if (chipsEl) chipsEl.addEventListener("click", (e) => { const c = e.target.closest(".chip[data-n]"); if (!c) return; setPerson(c.dataset.n, c.getAttribute("aria-pressed") !== "true"); });
    $("#sh-list").addEventListener("click", (e) => { const c = e.target.closest("button.nm"); if (!c) return; closeSheets(); setPerson(c.dataset.n, true); });   // S-06: 탭 → 하이라이트하고 시트 닫힘
  }
  if ($("#best-list")) {
    let minL = 2; const draw = () => drawBest(IS_ADMIN, minL); draw();
    app.querySelectorAll("[data-f]").forEach((f) => f.addEventListener("click", () => { minL = +f.dataset.f; app.querySelectorAll("[data-f]").forEach((x) => x.setAttribute("aria-pressed", x === f)); draw(); }));
    app.addEventListener("click", (e) => {
      const b = e.target.closest("button.best"); if (!b || !hasHeat) return; const on = b.getAttribute("aria-pressed") !== "true";
      app.querySelectorAll("button.best").forEach((x) => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", on);
      const [d, a, z] = b.dataset.r.split(",").map(Number); g.api.range(on ? d : null, a, z);
    });
  }
  if (CNF.includes(V) && V !== "past") confetti($("#cf"));
  if (Q.get("toast")) setTimeout(() => (Q.get("toast") === "uncf" ? toast("확정을 취소했어요. 단톡방에 알릴까요?", { label: "알리기" }) : toast("응답을 보냈어요")), 250);
  if (Q.get("sheet")) setTimeout(() => {
    const id = { confirm: "#sh-confirm", menu: "#sh-menu", delete: "#sh-del", cal: "#sh-cal", uncf: "#sh-uncf", list: "#sh-list", key: "#sh-key", delr: "#sh-delr" }[Q.get("sheet")];
    if (!id) return;
    if (id === "#sh-confirm") { const f = app.querySelector("[data-when]"); if (f) { $("#c-t").textContent = f.dataset.when + (CHANGE ? "로 바꿀까요?" : "로 확정할까요?"); $("#c-s").textContent = `${f.dataset.date ? 5 : N}명 중 ${f.dataset.c}명 가능`; } }
    if (id === "#sh-delr") { $("#dr-t").textContent = "지원의 응답을 지울까요?"; $("#dr-go").dataset.who = "지원"; }
    openSheet(id);
  }, 150);
})();
</script>
</body>
</html>
