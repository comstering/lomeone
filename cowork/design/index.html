<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로미원 웹디자인 시안 — 1단계 로미원 약속</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  body { background: var(--bg-subtle); }
  .top { padding-block: var(--s-8); }
  .grp { margin-top: var(--s-8); } .grp > h2 { margin-bottom: var(--s-4); }
  .row-x { display: flex; gap: var(--s-6); overflow-x: auto; padding-bottom: var(--s-4); align-items: flex-start; }
  .dev { flex: none; width: 360px; } .dev .cap { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .dev .cap a { color: var(--accent-ink); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .dev .cap small { font-weight: 400; color: var(--text-subtle); display: block; font-size: 12px; }
  .phone { width: 360px; height: 640px; border: 1px solid var(--border-strong); border-radius: 18px; overflow: hidden; background: var(--bg); box-shadow: var(--shadow-1); }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  code { background: var(--surface); border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap top stack-lg" style="max-width:1280px">
  <header class="stack">
    <div class="logo" id="lg"></div>
    <h1 class="t-display" style="font-size:32px;line-height:40px">웹디자인 시안 · 1단계 "로미원 약속"</h1>
    <p class="muted">기준 문서 <code>LM-PRD-01</code> v1.0 · 모바일 360px 기준 · 각 프레임은 실제 동작하는 HTML이에요 (칠하기·시트·상태 전환 가능). 데스크톱은 "전체 화면 ↗"로 열어 창 폭을 넓혀 보세요.</p>
    <div class="links">
      <button class="chip" onclick="sw('brand','a')">색 A안 민트 틸</button><button class="chip" onclick="sw('brand','b')">색 B안 코발트</button>
      <button class="chip" onclick="sw('theme','light')">라이트</button><button class="chip" onclick="sw('theme','dark')">다크</button><button class="chip" onclick="sw('inapp','1')">카톡 인앱 높이</button>
      <a class="chip" href="screens/brand.html">브랜드·토큰·컴포넌트</a><a class="chip" href="screens/og.html">카톡 미리보기(OG)</a>
    </div>
    <div class="links"><span class="t-caption">문서:</span><a class="chip" href="QUESTIONS.md">❓ 질문·제안·결정 필요</a><a class="chip" href="DESIGN-SPEC.md">📐 개발 핸드오프</a><a class="chip" href="README.md">README</a></div>
  </header>
  <div id="groups"></div>
</div>
<script src="assets/js/shared.js"></script>
<script>
  document.getElementById("lg").innerHTML = lmSymbol(32) + "<span>lomeone</span><span class='ko'>로미원</span>";
  const P = {};
  const sw = (k, v) => { P[k] = v; lmPrefs(k, v); draw(); };
  /* [ID, 제목, 설명, 파일+쿼리] */
  const G = [
    ["총무 흐름", [
      ["SCR-01", "홈", "히어로 데모 · 3단계 · 용도 칩 · 곧 나와요", "home.html"],
      ["SCR-02", "약속 랜딩 (팀플)", "폼이 첫 화면 · 용도별 6종", "meet.html?for=team-project"],
      ["SCR-03", "모임 만들기", "날짜를 탭하면 버튼이 활성화돼요", "new.html"],
      ["SCR-04", "공유 시트", "카톡 · 링크 복사 · 총무 링크", "new.html?sheet=1"],
      ["SCR-08", "총무 관리 (응답 중)", "추천 카드 + 확정 버튼", "m.html?v=admin"],
      ["SCR-08", "확정 확인 시트", "{시간}로 확정할까요?", "m.html?v=admin&sheet=confirm"],
      ["SCR-08", "응답 0명", "빈 상태 + 공유", "m.html?v=admin-empty"],
      ["SCR-08", "삭제 확인", "되돌릴 수 없음", "m.html?v=admin&sheet=delete"],
    ]],
    ["참여자 흐름", [
      ["SCR-05", "이름 입력", "처음 온 참여자의 첫 화면", "m.html?v=name"],
      ["SCR-06", "시간 칠하기 (A안)", "셀 = 칠하기 · 시간축 = 스크롤", "m.html?v=paint"],
      ["SCR-06", "시간 칠하기 (B안)", "D-8 대안: 칠하기 모드 토글", "m.html?v=paint&alt=b&coach=0"],
      ["SCR-06", "빈 그리드 + 8일", "0칸 제출 · 가로 넘김", "m.html?v=paint&filled=0&days=8&coach=0"],
      ["SCR-06b", "날짜만 모드", "돼요 · 애매 · 안 돼요", "m.html?v=dateonly"],
      ["SCR-07", "결과", "추천 Top3 · 히트맵 · 생성 유도", "m.html?v=result"],
      ["SCR-07", "전원 없음 + 동률", "가장 많이 되는 시간", "m.html?v=result-none"],
      ["SCR-07", "응답 1명", "공유 유도", "m.html?v=result-one"],
    ]],
    ["확정 · 재방문 · 예외", [
      ["SCR-09", "확정됨", "캡처해도 읽히는 카드", "m.html?v=confirmed"],
      ["SCR-09", "일부 불가", "4명 가능 · 민수 불가", "m.html?v=confirmed-part"],
      ["SCR-09", "변경됨", "시간이 바뀌었어요", "m.html?v=confirmed-changed"],
      ["SCR-09", "지난 모임", "생성 유도 강조", "m.html?v=past"],
      ["SCR-09", "캘린더 메뉴", "인앱 브라우저 안내 배너", "m.html?v=confirmed&sheet=cal"],
      ["SCR-10", "내 모임", "만든 / 응답한", "my.html"],
      ["SCR-10", "내 모임 (빈 상태)", "", "my.html?empty=1"],
      ["SCR-11", "404 · 만료 · 삭제", "새 총무가 되는 입구", "gone.html?k=expired"],
      ["SCR-12", "소개 / 개인정보", "문서 템플릿", "about.html?doc=privacy"],
    ]],
  ];
  function draw() {
    const qs = Object.entries(P).map(([k, v]) => `${k}=${v}`).join("&");
    const url = (f) => "screens/" + f + (qs ? (f.includes("?") ? "&" : "?") + qs : "");
    document.getElementById("groups").innerHTML = G.map(([g, items]) => `<section class="grp"><h2 class="t-h1">${g}</h2><div class="row-x">${items.map(([id, t, d, f]) => `
      <div class="dev"><div class="cap"><span>${id} · ${t}<small>${d}</small></span><a href="${url(f)}" target="_blank">전체 화면 ↗</a></div><div class="phone"><iframe src="${url(f)}" title="${id} ${t}" loading="lazy"></iframe></div></div>`).join("")}</div></section>`).join("");
  }
  draw();
</script>
</body>
</html>
